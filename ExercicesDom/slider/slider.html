<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Slider d'images</title>
    <link rel="stylesheet" href="slider.css">
</head>

<body style=" display: flex; flex-direction: column; justify-content: center; height: 100vh;">  
    <h1>Slider d'images</h1>
    <diV class="element" style="display: grid;">
        <div id="img">
            <img src="./elephant.jpg" alt="elephant" style="width: 400px; height: 300px;">
        </div>
        <div id="buttons">
            <button id="prev" style="width: 100px; height: 50px; background-color: black; color: white; position: center; text-align: center;">Previous</button>
            <button id="next" style="width: 100px; height: 50px; background-color: black; color: white; position: center; text-align: center;">Next</button>
        </div>
    </div>
    <script src="slider.js"></script>
</body>
</html>
