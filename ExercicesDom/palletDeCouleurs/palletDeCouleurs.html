<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="palletDeCouleurs.css">
    <title>pallet De Couleurs</title>
</head>
<body>
<h1>Palette de couleurs</h1>

<div  style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; margin-top: 20px;">
  <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; width: 100px; height: 80px; border: 1px solid #ccc; padding: 2px; box-sizing: border-box;">
    <div class="color-box" data-color="#FF0000" style="background-color: #FF0000;"></div>
    <div class="color-box" data-color="#00FF00" style="background-color: #00FF00;"></div>
    <div class="color-box" data-color="#0000FF" style="background-color: #0000FF;"></div>
    <div class="color-box" data-color="#FFFF00" style="background-color: #FFFF00;"></div>
    <div class="color-box" data-color="#FF00FF" style="background-color: #FF00FF;"></div>
    <div class="color-box" data-color="#00FFFF" style="background-color: #00FFFF; "></div>
    <div class="color-box" data-color="#800000" style="background-color: #800000;"></div>
    <div class="color-box" data-color="#008000" style="background-color: #008000;"></div>
    <div class="color-box" data-color="#000080" style="background-color: #000080;"></div>
    <div class="color-box" data-color="#808000" style="background-color: #808000;"></div>
    
    <div class="color-box" data-color="#800080" style="background-color: #800080;"></div>
    <div class="color-box" data-color="#008080" style="background-color: #008080"></div>
    <div class="color-box" data-color="#C0C0C0" style="background-color: #C0C0C0;"></div>
    <div class="color-box" data-color="#808080" style="background-color: #808080;"></div>
    <div class="color-box" data-color="#999999" style="background-color: #999999;"></div>
    
    <div class="color-box" data-color="#E6E6FA" style="background-color: #E6E6FA;"></div>
    <div class="color-box" data-color="#FFF0F5" style="background-color: #FFF0F5;"></div>
    <div class="color-box" data-color="#FAEBD7" style="background-color: #FAEBD7;"></div>
    <div class="color-box" data-color="#F0FFFF" style="background-color: #F0FFFF;"></div>
    <div class="color-box" data-color="#F0F8FF" style="background-color: #F0F8FF;"></div>
  </div>
</div>

<script src="palletDeCouleurs.js"></script>
</body>
</html>
