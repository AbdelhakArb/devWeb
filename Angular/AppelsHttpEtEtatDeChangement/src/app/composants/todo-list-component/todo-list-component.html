@if (isLoading)
{
    <p>Loading todo items...</p>

}
  
@else
{
    <ul>
    @for( todo of todos()?.todos || []; track todo.id ) {
        <li>{{ todo.todo }}</li>
        <li>
            <input type="checkbox" [checked]="todo.completed" disabled>
        </li>
        <li>{{ todo.userId }}</li>
    }
    @empty {
      <li>No tasks found!</li>
    }
    </ul>
    }
