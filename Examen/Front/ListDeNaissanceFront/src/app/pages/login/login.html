<div class="login-page-container">
  <div class="login-card">
    <h2>Espace {{ userType === 'Parent' ? 'Futurs Parents' : 'Visiteurs' }}</h2>
    <p class="login-subtitle">
      {{ userType === 'Parent' ? 'Connectez-vous pour gérer votre liste.' : 'Connectez-vous pour voir une liste de naissance.' }}
    </p>

    @if (messageErreur()) {
      <div class="alert error">
        {{ messageErreur() }}
      </div>
    }

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="userType">Vous êtes :</label>
        <select id="userType" name="userType" [(ngModel)]="userType" required class="form-control">
          <option value="Visiteur">Visiteur</option>
          <option value="Parent">Parent</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email">Adresse Email :</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="exemple@email.com" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe :</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="motDePasse" 
          placeholder="••••••••" 
          required 
        />
      </div>

      <button type="submit" [disabled]="!loginForm.form.valid || isSubmitting()" class="btn-login">
        @if (isSubmitting()) {
          Connexion en cours...
        } @else {
          Se connecter
        }
      </button>
    </form>

    <div class="login-footer">
      <p>Pas encore de compte ? 
        <a routerLink="/inscription">Créez un compte</a>
      </p>
    </div>
  </div>
</div>
