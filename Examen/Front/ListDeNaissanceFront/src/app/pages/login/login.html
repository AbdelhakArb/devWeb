<div class="login-page-container">
  <div class="login-card">
    <h2>Espace Futurs Parents</h2>
    <p class="login-subtitle">Connectez-vous pour gérer votre liste de naissance ou en créer une nouvelle.</p>

    @if (messageErreur) {
    <div class="alert error">
      {{ messageErreur }}
    </div>
    }

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Adresse Email :</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="exemple@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe :</label>
        <input type="password" id="password" name="password" [(ngModel)]="motDePasse" placeholder="••••••••" required>
      </div>

      <button type="submit" [disabled]="!loginForm.form.valid || isSubmitting" class="btn-login">
        @if (isSubmitting) {
        Connexion en cours...
        } @else {
        Se connecter
        }
      </button>
    </form>

    <div class="login-footer">
      <p>Pas encore de compte ? <a routerLink="/inscription">Créez un compte parent</a></p>
    </div>
  </div>
</div>
