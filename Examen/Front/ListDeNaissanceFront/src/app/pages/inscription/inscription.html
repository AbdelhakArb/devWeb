<div class="login-page-container">
  <div class="login-card">
    <h2>Créer un compte 👶</h2>
    <p class="login-subtitle">Rejoignez-nous pour gérer ou offrir des cadeaux de naissance.</p>

    @if (messageErreur()) {
      <div class="alert error">{{ messageErreur() }}</div>
    }

    @if (messageSucces()) {
      <div class="alert success">{{ messageSucces() }}</div>
    }

    <form (submit)="$event.preventDefault(); onInscription()">
      
      <div class="form-group role-selection">
        <label>Vous êtes :</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="role" value="parent" [checked]="typeUtilisateur() === 'parent'" (change)="typeUtilisateur.set('parent')"> 
            👪 Parent
          </label>
          <label>
            <input type="radio" name="role" value="visiteur" [checked]="typeUtilisateur() === 'visiteur'" (change)="typeUtilisateur.set('visiteur')"> 
            🎁 Visiteur / Proche
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" [(ngModel)]="nom" placeholder="Ex: Dupont" required>
      </div>

      <div class="form-group">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" [(ngModel)]="prenom" placeholder="Ex: Jean" required>
      </div>

      <div class="form-group">
        <label for="email">Adresse Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="exemple@mail.com" required>
      </div>

      <div class="form-group">
        <label for="adresse">Adresse</label>
        <input type="text" id="adresse" name="adresse" [(ngModel)]="adresse" placeholder="Ex: 12 rue de la Paix">
      </div>

      <div class="form-group">
        <label for="cp">Code Postal</label>
        <input type="text" id="cp" name="cp" [(ngModel)]="cp" placeholder="Ex: 75001">
      </div>

      <div class="form-group">
        <label for="ville">Ville</label>
        <input type="text" id="ville" name="ville" [(ngModel)]="ville" placeholder="Ex: Paris">
      </div>

      <div class="form-group">
        <label for="pays">Pays</label>
        <input type="text" id="pays" name="pays" [(ngModel)]="pays" placeholder="Ex: France">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="motDePasse" [(ngModel)]="motDePasse" placeholder="********" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" name="confirmationMdp" [(ngModel)]="confirmationMdp" placeholder="********" required>
      </div>

      <button type="submit" class="btn-login" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Création en cours...' : "S'inscrire" }}
      </button>
    </form>

    <div class="login-footer">
      <p>Déjà un compte ? <a routerLink="/login">Connectez-vous ici</a></p>
    </div>
  </div>
</div>
