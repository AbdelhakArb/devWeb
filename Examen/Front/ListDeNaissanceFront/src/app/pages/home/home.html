<div class="home-container">
  <div class="hero">
    <div class="hero-content">
      <h1>Bienvenue sur BabyList</h1>
      <p>L'espace dédié à vos plus beaux moments.</p>
    </div>
  </div>

  <div class="actions-grid">
    <!-- On affiche tout le monde, et on gère la sécurité au clic -->
    <button (click)="accederAction('/creer-liste', 'Parent')" class="btn-action green">Créer Votre Liste</button>
    <button (click)="accederAction('/gestion-liste', 'Parent')" class="btn-action yellow">Gérer Votre Liste</button>
    <button (click)="accederAction('/visiteur', 'Visiteur')" class="btn-action blue">Offrir un Cadeau</button>
    <button routerLink="/modeles" class="btn-action gray">Voir Modèles</button>
  </div>
</div>
