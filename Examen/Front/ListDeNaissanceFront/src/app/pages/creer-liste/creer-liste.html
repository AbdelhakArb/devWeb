<div class="creer-liste-container">
  <h2>Créer une nouvelle liste de naissance</h2>
  <p class="subtitle">Remplissez les informations ci-dessous pour démarrer votre liste.</p>

  @if (messageSucces) {
    <div class="alert success">
      {{ messageSucces }}
    </div>
  }

  @if (messageErreur) {
    <div class="alert error">
      {{ messageErreur }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" #listeForm="ngForm">
    
    <div class="form-group">
      <label for="nomListe">Nom de la liste de naissance :</label>
      <input 
        type="text" 
        id="nomListe" 
        name="nomListe" 
        [(ngModel)]="nomListe" 
        placeholder="Ex: Pour l'arrivée de notre bébé" 
        required
      >
    </div>

    <div class="form-group">
      <label for="dateAccouchement">Date prévue d'accouchement (Optionnel) :</label>
      <input 
        type="date" 
        id="dateAccouchement" 
        name="dateAccouchement" 
        [(ngModel)]="dateAccouchement"
      >
    </div>

    <div class="form-group">
      <label for="lieu">Lieu / Maternité (Optionnel) :</label>
      <input 
        type="text" 
        id="lieu" 
        name="lieu" 
        [(ngModel)]="lieu"
        placeholder="Ex: Hôpital Civil"
      >
    </div>

    <button 
      type="submit" 
      [disabled]="!listeForm.form.valid || isSubmitting" 
      class="btn-submit"
    >
      @if (isSubmitting) {
        Création en cours...
      } @else {
        Créer ma liste
      }
    </button>

  </form>
</div>
